services:
  postgres:
    image: postgres:17-alpine
    container_name: hearth-postgres
    environment:
      POSTGRES_DB: hearth
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: hearth_dev
    ports:
      - "5433:5432"
    volumes:
      - hearth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  hearth_pgdata:
